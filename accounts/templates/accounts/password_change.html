{% extends "pdp/base.html" %}

{% block pdp_title %}Update Password{% endblock %}
{% block pdp_subtitle %}Choose a new password before continuing.{% endblock %}

{% block pdp_content %}
<section class="pdp-grid pdp-grid--single">
    <article class="pdp-card pdp-card--form">
        <h2>New password</h2>
        <form method="post" class="pdp-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button button--primary" type="submit">Save Password</button>
        </form>
    </article>
</section>
{% endblock %}
